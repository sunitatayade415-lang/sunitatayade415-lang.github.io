<!DOCTYPE html>
<html>
  <head>
    <title>Tiranga Premium Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        display:flex;
        justify-content:center;
        height:100vh;
        align-items:center;
        margin:0;
        background-color:#0f111a;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }
      .tiranga-border-ring {
        width:90%;
        max-width:380px;
        padding:5px;
        background:linear-gradient(45deg,#ff9933,#ffffff,#138808);
        border-radius:40px;
        box-shadow:0 0 30px rgba(255,153,51,0.4);
        margin:20px auto;
        position: relative; /* खालचं नाव साठी */
        padding-bottom: 60px; /* खाली जागा */
      }
      .tirangacard {
        background-color:#1a1d29;
        border-radius:35px;
        text-align:center;
        padding:30px 20px;
        color:white;
      }
      .tiranga-ring {
        width:150px;
        height:130px;
        border-radius:60px;
        text-align:center;
        border:5px solid;
        background:linear-gradient(45deg,orange,white,green);
        margin:30px auto;
        padding-top:30px;
        font-size:100px;
      }
      h1 { font-weight:800; letter-spacing:1px; margin-top:0; font-size: 50px; }
      p { font-weight:bold; text-transform:uppercase; font-size:24px; letter-spacing:1px; color:#fafafa; text-shadow:0 0 10px rgba(255,255,255,0.5); }
      button {
        background-color:#0056b3; color:white; padding:12px 0; margin-top:25px; cursor:pointer; border-radius:50px; border:none; width:80%; text-align:center; font-size:20px; font-weight:bold; text-transform:uppercase; box-shadow:0 0 15px rgba(0,80,179,0.6); transition:0.3s;
      }
      button:hover { transform:scale(1.05); background-color:#138808; box-shadow:0 0 25px rgba(19,136,8,0.6); }
      button:disabled { background-color: grey; cursor: not-allowed; transform: none; }
      
      /* खाली नाव दाखवण्यासाठी */
      .saved-name {
        position: absolute;
        bottom: 15px;
        width: 100%;
        text-align: center;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
      }
      .saved-name span { color: #ff9933; }
    </style>
  </head>
  <body>

    <!-- PAGE 1: Main Card -->
    <div id="page1" class="page active">
      <div class="tiranga-border-ring">
        <div class="tiranga-ring">🇮🇳</div>
        
        <div class="tirangacard">
          <h1>
            <span style="color: #ff9933;">T</span><span style="color: #ff9933;">i</span><span style="color: #ffffff;">r</span><span style="color: #ffffff;">a</span><span style="color: #ffffff;">n</span><span style="color: #138808;">g</span><span style="color: #138808;">a</span>
          </h1>
          
          <div style="font-size: 70px; margin: 20px 0;">🇮🇳</div>
          <p>Jai Hind</p>
          <button id="salamiBtn" onclick="giveSalami()">Salami</button>
        </div>

        <!-- इथे खाली नाव येईल -->
        <div class="saved-name" id="nameAtBottom"></div>
      </div>
    </div>

    <!-- PAGE 2: Welcome Page -->
    <div id="page2" class="page">
      <div class="tiranga-border-ring">
        <div class="tiranga-ring">🫡</div>
        <div class="tirangacard">
          <h1 style="font-size: 35px; color: #ff9933;">Swagat Hai!</h1>
          <p style="font-size: 18px; text-transform: none;">Dhanyawad <span id="userName" style="color:#ff9933;"></span></p>
          <p style="font-size: 20px;">Aapne Tiranga ko Salami Di 🇮🇳</p>
          <button onclick="showPage1()">Wapas Jaaye</button>
        </div>
      </div>
    </div>

    <script>
      // Page load zalyavar check kara
      window.onload = function() {
        let savedName = localStorage.getItem("tirangaUser");
        if(savedName) {
          // 1. Button band kara
          document.getElementById("salamiBtn").innerText = "Salami Di Gayi";
          document.getElementById("salamiBtn").disabled = true;
          
          // 2. Khali naav dakha
          document.getElementById("nameAtBottom").innerHTML = `Salami by: <span>${savedName}</span>`;
        }
      }

      function giveSalami() {
        // 1. Naav vicharaycha
        let name = prompt("Kripya apna naam bataye:"); 
        
        if(name == null || name.trim() == "") {
          alert("Naam dalna zaroori hai!");
          return;
        }

        // 2. Naav save kara localStorage madhe - he 1dach hoil
        localStorage.setItem("tirangaUser", name);

        // 3. Page 2 var naav dakha
        document.getElementById("userName").innerText = name;
        document.getElementById("page1").classList.remove("active");
        document.getElementById("page2").classList.add("active");

        // 4. Button band ani khali naav update
        document.getElementById("salamiBtn").innerText = "Salami Di Gayi";
        document.getElementById("salamiBtn").disabled = true;
        document.getElementById("nameAtBottom").innerHTML = `Salami by: <span>${name}</span>`;
      }

      function showPage1() {
        document.getElementById("page2").classList.remove("active");
        document.getElementById("page1").classList.add("active");
      }
    </script>
         
  </body>
</html>
